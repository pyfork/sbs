<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbs · side by side with labels</title>
<script>try { const t = localStorage.getItem('sbs-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root {
    color-scheme: light dark;
    --page: light-dark(#3a57fc, #0b1026);
    --on-page: #ffffff;
    --on-page-dim: rgba(255,255,255,0.7);
    --card: light-dark(#ffffff, #151b38);
    --ink: light-dark(#000000, #f2f4ff);
    --dim: light-dark(rgba(0,0,0,0.65), rgba(242,244,255,0.65));
    --edge: light-dark(rgba(0,0,0,0.2), rgba(255,255,255,0.22));
    --edge-hi: light-dark(rgba(0,0,0,0.45), rgba(255,255,255,0.5));
    --blue: light-dark(#3a57fc, #8c9dff);
    --cta: #389168;            /* main buttons only (Append, Download) */
    --orange-text: light-dark(#f75a03, #ffa04d);
    --track: light-dark(rgba(0,0,0,0.15), rgba(255,255,255,0.2));
    --field: light-dark(#ffffff, #0f1530);
    --checker: light-dark(#f0f0f0, #1c2346);
    /* system fonts only (no download); hierarchy comes from weight */
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --w-body: 400;   /* hints, meta, footer */
    --w-ui: 500;     /* choices, links, notes */
    --w-label: 600;  /* field labels, small buttons, browse */
    --w-head: 700;   /* card headings, main buttons, LEFT/RIGHT tags */
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: var(--w-body) 18px/28px var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .ico { width: 20px; height: 20px; flex: none; }
  input[type=file] { display: none; }
  /* one focus style everywhere: blue on the white card, white on the blue page */
  :root { --focus: var(--blue); }
  .top, footer { --focus: #fff; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 30px 32px 0 40px; }
  .logo { font: var(--w-body) 22px/24px var(--sans); letter-spacing: -0.3px; color: var(--on-page); }
  .logo b { font-weight: var(--w-head); letter-spacing: 0; }

  main { width: 100%; margin: 0 auto; padding-top: 104px; }

  .card { background: var(--card); padding: 32px 40px 48px; }
  /* carousel: both cards sit side by side on one track. Append moves the track left; each card's content
     travels a little less than the card (parallax). Plain CSS transitions, no library. */
  .deck { overflow-x: clip; --gap: 48px; --t: 900ms; --ease: cubic-bezier(.65, .05, .36, 1); --para: 160px; }
  .track { width: 880px; max-width: 100%; margin: 0 auto; display: grid; grid-template-columns: 100% 100%; column-gap: var(--gap); align-items: start; transition: transform var(--t) var(--ease); }
  .deck.at-2 .track { transform: translateX(calc(-100% - var(--gap))); }
  .track > .card { overflow: clip; transition: opacity var(--t) var(--ease), visibility 0s; }
  .track > .card > * { transition: transform var(--t) var(--ease); }
  /* the card that is away: dimmed, its content held back, and hidden (out of tab order and screen readers) once it has left */
  .deck:not(.at-2) .result, .deck.at-2 .step1 { opacity: 0.35; visibility: hidden; transition: opacity var(--t) var(--ease), visibility 0s var(--t); }
  .deck:not(.at-2) .result > * { transform: translateX(var(--para)); }
  .deck.at-2 .step1 > * { transform: translateX(calc(-1 * var(--para))); }
  .result.leaving { display: block; }
  .deck.no-slide .track, .deck.no-slide .card, .deck.no-slide .card > * { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .track, .track > .card, .track > .card > *, .deck .card { transition: none !important; } }
  .head-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .card-head h2:focus { outline: 0; }
  h2 { margin: 0; font: var(--w-head) 44px/48px var(--sans); letter-spacing: -0.02em; }

  /* layout: two checkbox-shaped buttons that act as one toggle; both always visible */
  .modes { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 24px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; text-align: left; font: var(--w-ui) 20px/24px var(--sans); cursor: pointer; }
  .box { position: relative; width: 22px; height: 22px; flex: none; border: 2px solid var(--edge); border-radius: 3px; background: var(--field); }
  .check:hover .box { border-color: var(--edge-hi); }
  .check.active .box, .check input:checked + .box { border-color: var(--blue); background: var(--blue); }
  .check.active .box::after, .check input:checked + .box::after { content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .check input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }
  .annotate { margin-top: 14px; }

  /* labels / boxes with the swap icon between / paste note under the box paste goes to */
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr); column-gap: 16px; margin-top: 24px; }
  .fields > :nth-child(-n+3) { grid-column: 1; }
  .fields > :nth-child(n+4) { grid-column: 3; }
  .fields > :nth-child(3n+1) { grid-row: 1; }
  .fields > :nth-child(3n+2) { grid-row: 2; }
  .fields > :nth-child(3n) { grid-row: 3; }
  .fields .swap-col { grid-row: 2; grid-column: 2; align-self: center; }
  .field-label { margin: 0 0 8px; color: var(--dim); font: var(--w-label) 18px/24px var(--sans); }
  /* slot height gives way so the landing fits short laptop screens (768 tall) without scroll */
  .slot { position: relative; height: clamp(100px, calc(100vh - 626px), 240px); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--edge); border-radius: 4px; background: var(--field); cursor: pointer; }
  .slot:hover { border-color: var(--edge-hi); }
  .slot.target { border-color: var(--blue); }
  /* the paste box and the keyboard focus are the same thing, so a focused box shows the same blue, a step stronger */
  .slot:focus-visible { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 4px light-dark(rgba(58,87,252,0.25), rgba(140,157,255,0.3)); }
  .slot.drag { border-color: var(--blue); background: light-dark(#eef1ff, #1a2350); }
  .slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; color: var(--dim); font: var(--w-body) 18px/24px var(--sans); }
  .placeholder .big { display: none; }
  /* browse: a pill button, so only it opens the file picker, not the whole box */
  .browse { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; height: 44px; margin-top: 6px; padding: 0 20px; border: 2px solid var(--edge); border-radius: 999px; background: var(--card); color: var(--blue); font: var(--w-label) 17px/24px var(--sans); }
  .browse .ico { width: 18px; height: 18px; }
  .browse:hover { border-color: var(--blue); background: light-dark(#f5f7ff, #18204a); }
  .slot .label { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 2px 8px; border-radius: 4px; background: var(--card); border: 2px solid var(--edge); font: var(--w-head) 13px/18px var(--sans); letter-spacing: 0.5px; }
  .slot .filename { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 16px 10px 6px; font: var(--w-body) 14px var(--sans); color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.8) 45%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .clear { position: absolute; top: 6px; right: 6px; z-index: 3; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 2px solid var(--edge); border-radius: 4px; background: var(--card); }
  .slot .clear .ico { width: 16px; height: 16px; }

  .swap { display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 2px solid var(--edge); border-radius: 50%; background: var(--card); color: var(--ink); }
  .swap:hover { border-color: var(--blue); color: var(--blue); }
  .swap .ico { width: 22px; height: 22px; }
  .paste-note { margin: 8px 0 0; min-height: 24px; visibility: hidden; color: var(--blue); font: var(--w-ui) 17px/24px var(--sans); }
  .fields:has(#slotA.target) .note-a, .fields:has(#slotB.target) .note-b { visibility: visible; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 32px; }
  .actions .go { margin-top: 0; }

  /* Start over and Back: small buttons at the card's top right */
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .reset-small { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 2px solid var(--edge); border-radius: 4px; background: var(--card); color: var(--ink); font: var(--w-label) 15px/20px var(--sans); }
  .reset-small:not(:disabled):hover { border-color: var(--blue); color: var(--blue); }
  .reset-small:disabled { opacity: 0.45; }
  .reset-small .ico { width: 16px; height: 16px; }
  .link { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; padding: 0; border: 0; background: none; color: var(--blue); font: var(--w-ui) 18px/24px var(--sans); }
  .link:hover { text-decoration: underline; }
  .link.copied { color: var(--orange-text); }

  .go { display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; height: 72px; padding: 17px 32px; border: 2px solid transparent; border-radius: 0; background: var(--cta); color: #eeeeee; font: var(--w-head) 30px/34px var(--sans); text-transform: uppercase; letter-spacing: 0.02em; box-shadow: 0 4px 4px rgba(0,0,0,0.1); }
  .go .ico { width: 28px; height: 28px; stroke-width: 2; }
  .go:not(:disabled):hover { background: #2c622c; }
  .go:disabled { opacity: 0.5; }

  .result { display: none; }
  .result.show { display: block; }
  .shot { margin-top: 24px; }
  .shot img { display: block; max-width: 100%; max-height: clamp(100px, calc(100vh - 664px), 640px); object-fit: contain; border-radius: 4px; background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .meta { margin: 8px 0 0; color: var(--dim); }
  .filename-field { width: 100%; height: 42px; padding: 9px 16px; border: 2px solid var(--edge); border-radius: 4px; background: var(--field); color: var(--ink); font: var(--w-body) 18px/24px var(--sans); }
  .filename-field:focus { outline: 0; border-color: var(--blue); }
  .links { display: flex; flex-wrap: wrap; gap: 8px 32px; }
  .mt24 { margin-top: 24px; }

  footer { width: 480px; max-width: calc(100% - 32px); margin: 32px auto 0; padding-bottom: 32px; text-align: center; color: var(--on-page-dim); font: var(--w-body) 17px/24px var(--sans); }
  .theme { position: fixed; right: 40px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; }
  .theme button { display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,0.4); color: #fff; }
  .theme button.active { background: rgba(0,0,0,0.7); box-shadow: 0 0 0 2px #fff; }

  @media (max-width: 760px) {
    .top { position: static; padding: 20px 16px 0 20px; }
    main { padding: 24px 16px 0; }
    .deck { --para: 56px; }
    .card { padding: 24px 20px 32px; }
    h2 { font-size: 36px; line-height: 40px; }
    .fields { grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); column-gap: 8px; }
    .swap { width: 40px; height: 40px; }
    .paste-note { font-size: 15px; line-height: 20px; }
    .slot { height: 170px; }
    .card-head h2 { font-size: 28px; line-height: 32px; white-space: nowrap; }
    .reset-small { padding: 0 10px; font-size: 15px; }
    .browse { height: 40px; padding: 0 14px; font-size: 16px; }
    .browse .wide { display: none; }
    .placeholder .big { display: none; }
    .check, .field-label, .link, .filename-field { font-size: 17px; }
    .go { width: 100%; justify-content: center; }
    .theme { position: static; flex-direction: row; justify-content: center; margin-top: 24px; }
  }
</style>
</head>

<div class="top">
  <span class="logo"><b>SBS</b> - Join two images</span>
</div>

<main class="deck">
<div class="track">

  <section class="card step1">
    <div class="card-head"><h2>Side by side</h2><button type="button" class="reset-small" id="resetBtn" disabled><svg class="ico" aria-hidden="true"><use href="#i-arrow-path"/></svg><span>Start over</span></button></div>

    <div class="modes" role="group" aria-label="Layout">
      <button type="button" class="check active" id="modeH"><span class="box"></span>Horizontal</button>
      <button type="button" class="check" id="modeV"><span class="box"></span>Vertical</button>
    </div>
    <label class="check annotate"><input type="checkbox" id="annotate" checked><span class="box"></span><span>Add text labels to the output</span></label>

    <div class="fields">
      <p class="field-label">Left image</p>
      <div class="slot" id="slotA" tabindex="0" aria-label="Left image"></div>
      <p class="paste-note note-a">Paste goes here</p>
      <p class="field-label">Right image</p>
      <div class="slot" id="slotB" tabindex="0" aria-label="Right image"></div>
      <p class="paste-note note-b">Paste goes here</p>
      <div class="swap-col"><button type="button" class="swap" id="swapBtn" title="Swap left and right" aria-label="Swap left and right"><svg class="ico" aria-hidden="true"><use href="#i-arrows-right-left"/></svg></button></div>
    </div>
    <p class="sr-only" id="pasteHint" aria-live="polite"></p>

    <div class="actions">
      <button type="button" class="go" id="submitBtn" disabled>Append<svg class="ico" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </div>
  </section>

  <section class="card result" id="result">
    <div class="card-head"><h2 tabindex="-1">Your image</h2><span class="head-acts">
      <button type="button" class="reset-small" id="backBtn"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg><span>Back</span></button>
      <button type="button" class="reset-small" id="resetTwin"><svg class="ico" aria-hidden="true"><use href="#i-arrow-path"/></svg><span>Start over</span></button>
    </span></div>
    <div class="shot" id="resultWrapper"><img id="resultImg" alt="appended result"></div>
    <p class="meta" id="resultMeta"></p>
    <p class="field-label mt24"><label for="filenameField">File name</label></p>

<script>
  const state = { A: null, B: null, mode: 'h', out: null, target: null };
  const $ = id => document.getElementById(id);
  const SIDE = { A: 'LEFT', B: 'RIGHT' };
  const icon = name => `<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  function setupSlot(key) {
    const slot = $('slot' + key);
    const select = () => { state.target = key; refresh(); };

    slot.addEventListener('click', select);
    slot.addEventListener('focus', () => { if (state.target !== key && slot.tabIndex !== 0) select(); });
    slot.addEventListener('keydown', e => {
      if (e.target === slot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(); }
    });
    slot.addEventListener('change', e => {
      if (e.target.files[0]) loadFile(key, e.target.files[0]);
    });

    ['dragenter','dragover'].forEach(evt =>
      slot.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        slot.classList.add('drag');
      })
    );
    ['dragleave','drop'].forEach(evt =>
      slot.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        slot.classList.remove('drag');
      })
    );
    slot.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadFile(key, f);
    });
  }

  function loadFile(key, file, name = file.name) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        state[key] = { file, img, name };
        state.target = null;
        renderSlot(key);
        $('result').classList.remove('show');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderSlot(key) {
    const slot = $('slot' + key);
    const s = state[key];
    slot.classList.toggle('filled', !!s);
    if (!s) {
      slot.innerHTML = `<span class="label">${SIDE[key]}</span>
        <div class="placeholder">paste or drop<button class="browse" type="button">${icon('arrow-up-tray')}<span>Browse<span class="wide"> image</span></span></button></div>
        <input type="file" id="input${key}" accept="image/*">`;
      slot.querySelector('.browse').addEventListener('click', () => $('input' + key).click());
    } else {
      slot.innerHTML = `<span class="label">${SIDE[key]}</span>
        <img src="${s.img.src}" alt="">
        <span class="filename"></span>
        <button class="clear" type="button" title="clear" aria-label="Clear ${SIDE[key]} image">${icon('x-mark')}</button>`;
      slot.querySelector('.filename').textContent = s.name;
      slot.querySelector('.clear').addEventListener('click', e => {
        e.stopPropagation();
        state[key] = null;
        renderSlot(key);
        $('result').classList.remove('show');
      });
    }
    refresh();
  }

  function refresh() {
    $('submitBtn').disabled = !(state.A && state.B);
    $('resetBtn').disabled = !(state.A || state.B);
    const t = state.target || (!state.A ? 'A' : !state.B ? 'B' : null);
    ['A', 'B'].forEach(k => $('slot' + k).classList.toggle('target', k === t));
    $('pasteHint').textContent = t
      ? `Paste goes to the ${SIDE[t]} panel · click a panel to pick another`
      : 'Both panels are full · click one to replace it, or paste to start a new pair';
    // roving focus: the paste box and keyboard focus are one thing, so only one box is ever highlighted
    const hadFocus = inSlots();
    ['A', 'B'].forEach(k => { $('slot' + k).tabIndex = k === (t || 'A') ? 0 : -1; });
    if (hadFocus && t && document.activeElement !== $('slot' + t)) $('slot' + t).focus({ preventScroll: true });
  }
  const inSlots = () => ['A', 'B'].some(k => $('slot' + k) === document.activeElement);

  $('swapBtn').addEventListener('click', () => {
    [state.A, state.B] = [state.B, state.A];
    renderSlot('A');
    renderSlot('B');
    $('result').classList.remove('show');
  });

  $('resetBtn').addEventListener('click', () => {
    state.A = state.B = state.out = state.target = null;
    renderSlot('A');
    renderSlot('B');
    $('result').classList.remove('show');
  });

  $('modeH').addEventListener('click', () => setMode('h'));
  $('modeV').addEventListener('click', () => setMode('v'));
  function setMode(m) {
    state.mode = m;
    [['modeH', 'h'], ['modeV', 'v']].forEach(([id, k]) => {
      $(id).classList.toggle('active', m === k);
      $(id).setAttribute('aria-pressed', m === k);
    });
  }

  function setTheme(t) {
    if (t === 'device') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach(b => {
      const on = b.dataset.pick === t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
    try { if (t === 'device') localStorage.removeItem('sbs-theme'); else localStorage.setItem('sbs-theme', t); } catch {}
  }
  document.querySelectorAll('#theme button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.pick)));

  function stripExt(name) {
    return name.replace(/\.[^/.]+$/, '');
  }

  $('submitBtn').addEventListener('click', () => {
    const a = state.A.img, b = state.B.img;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const labels = $('annotate').checked;

    if (state.mode === 'h') {
      const h = Math.max(a.height, b.height);
      const barWidth = labels ? Math.round(Math.min(Math.max(h * 0.08, 28), 220)) : 0;
      const fontSize = Math.round(barWidth * 0.62);
      const aw = a.width * (h / a.height);
      const bw = b.width * (h / b.height);
      canvas.width = Math.round(aw + bw + barWidth * 2);
      canvas.height = h;

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, 0, barWidth, h);
      ctx.drawImage(a, barWidth, 0, aw, h);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(barWidth + aw, 0, barWidth, h);
      ctx.drawImage(b, barWidth * 2 + aw, 0, bw, h);

      if (labels) {
      ctx.fillStyle = 'white';
      ctx.font = `bold ${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(barWidth / 2, h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('LEFT', 0, 0);
      ctx.restore();

      ctx.save();
      ctx.translate(barWidth + aw + barWidth / 2, h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('RIGHT', 0, 0);
      ctx.restore();
      }
    } else {
      const w = Math.max(a.width, b.width);
      const barWidth = labels ? Math.round(Math.min(Math.max(w * 0.08, 28), 220)) : 0;
      const fontSize = Math.round(barWidth * 0.62);
      const ah = a.height * (w / a.width);
      const bh = b.height * (w / b.width);
      canvas.width = w;
      canvas.height = Math.round(ah + bh + barWidth * 2);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, 0, w, barWidth);
      ctx.drawImage(a, 0, barWidth, w, ah);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, barWidth + ah, w, barWidth);
      ctx.drawImage(b, 0, barWidth * 2 + ah, w, bh);

      if (labels) {
      ctx.fillStyle = 'white';
      ctx.font = `bold ${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(w / 2, barWidth / 2);
      ctx.fillText('LEFT', 0, 0);
      ctx.restore();

      ctx.save();
      ctx.translate(w / 2, barWidth + ah + barWidth / 2);
      ctx.fillText('RIGHT', 0, 0);
      ctx.restore();
      }
    }

    const dataUrl = canvas.toDataURL('image/png');
    if (dataUrl === 'data:,') {
      alert('These images are too large for this browser to combine. Shrink them and try again.');
      return;
    }
    state.out = canvas;
    $('resultImg').src = dataUrl;
    $('resultMeta').textContent =
      `${canvas.width} × ${canvas.height}px · ${state.mode === 'h' ? 'horizontal' : 'vertical'} append (${labels ? 'with' : 'no'} labels)`;

    const suggested = `${stripExt(state.A.name)}_${stripExt(state.B.name)}.png`;
    $('filenameField').value = suggested;
    $('result').classList.add('show');

    $('downloadBtn').onclick = () => {
      const a2 = document.createElement('a');
      a2.href = dataUrl;
      a2.download = $('filenameField').value || 'appended.png';
      a2.click();
    };
  });

  function flash(btn, text, ok = true) {
    const label = btn.querySelector('span');
    label.dataset.orig ||= label.textContent;
    label.textContent = text;
    btn.classList.toggle('copied', ok);
    setTimeout(() => { label.textContent = label.dataset.orig; btn.classList.remove('copied'); }, 1200);
  }

  $('copyBtn').addEventListener('click', async () => {
    const btn = $('copyBtn');
    try {
      await navigator.clipboard.writeText($('filenameField').value);
      flash(btn, 'copied');
    } catch {
      flash(btn, 'copy blocked', false);
    }
  });

  $('copyImgBtn').addEventListener('click', async () => {
    const btn = $('copyImgBtn');
    try {
      const blob = new Promise(r => state.out.toBlob(r));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      flash(btn, 'copied');
    } catch {
      flash(btn, 'copy blocked · use download', false);
    }
  });

  document.addEventListener('paste', e => {
    const file = [...e.clipboardData.files].find(f => f.type.startsWith('image/'));
    if (!file) return;
    e.preventDefault();
    const key = state.target || (!state.A ? 'A' : !state.B ? 'B' : 'A');
    if (!state.target && state.A && state.B) { state.B = null; renderSlot('B'); }
    loadFile(key, file, key === 'A' ? 'left.png' : 'right.png');
  });

  // left and right arrow keys move the paste box (and focus, when focus is on a box)
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.target.closest('input, textarea, select, [contenteditable]')) return;
    const k = { ArrowLeft: 'A', ArrowRight: 'B' }[e.key];
    if (!k) return;
    e.preventDefault();
    const moveFocus = inSlots();
    state.target = k;
    refresh();
    if (moveFocus) $('slot' + k).focus({ preventScroll: true });
  });

  // Append moves a two-card carousel to the result card; Back moves it back.
  // One observer on the result's "show" class covers every path (Append, Back, clear, swap, new paste).
  const deck = document.querySelector('.deck'), step1 = document.querySelector('.step1'), step2 = $('result');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let showing = false, token = 0;
  const settle = fn => { const t = ++token; setTimeout(() => t === token && fn(), still.matches ? 0 : 950); };
  new MutationObserver(() => {
    const on = step2.classList.contains('show');
    if (on === showing) return;
    showing = on;
    if (on) {
      step2.classList.remove('leaving');
      step1.inert = true; step2.inert = false;
      // let the result lay out off to the right first, then move; focus once it is visible
      requestAnimationFrame(() => requestAnimationFrame(() => { deck.classList.add('at-2'); step2.querySelector('h2').focus({ preventScroll: true }); }));
    } else {
      step2.classList.add('leaving'); // keep it on screen while it slides away
      step2.inert = true; step1.inert = false;
      deck.classList.remove('at-2');
      document.querySelector('.slot[tabindex="0"]')?.focus({ preventScroll: true });
      settle(() => step2.classList.remove('leaving'));
    }
  }).observe(step2, { attributes: true, attributeFilter: ['class'] });
  $('backBtn').addEventListener('click', () => step2.classList.remove('show'));
  // Start over is not Back: the card in view sinks away, then a fresh empty card drops in from the top.
  let fresh = false;
  async function freshStart(e) {
    if (fresh) return; // the inner click below runs the app's own reset
    e?.stopImmediatePropagation();
    const from = showing ? step2 : step1;
    from.inert = true;
    if (!still.matches) await from.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(56px)', opacity: 0 }],
      { duration: 320, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' }).finished;
    deck.classList.add('no-slide');
    fresh = true; $('resetBtn').click(); fresh = false;
    showing = false; // handled here, so the observer leaves it alone
    step2.classList.remove('leaving'); step2.inert = true;
    deck.classList.remove('at-2');
    void deck.offsetWidth; // apply the jump with no transition
    deck.classList.remove('no-slide');
    from.getAnimations().forEach(a => a.cancel());
    step1.inert = false;
    if (!still.matches) step1.animate([{ transform: 'translateY(-72px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 640, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    document.querySelector('.slot[tabindex="0"]')?.focus({ preventScroll: true });
  }
  $('resetBtn').addEventListener('click', freshStart, true);
  $('resetTwin').addEventListener('click', () => freshStart());

  setupSlot('A');
  setupSlot('B');
  renderSlot('A');
  renderSlot('B');
  setMode('h');
  let saved = 'device';
  try { const t = localStorage.getItem('sbs-theme'); if (t === 'light' || t === 'dark') saved = t; } catch {}
  setTheme(saved);
</script>
</body>
</html>
