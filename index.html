<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbs · side by side with labels</title>
<script>try { const t = localStorage.getItem('sbs-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root {
    color-scheme: light dark;
    /* shortcut: light-dark() needs a browser from 2024 or later; add a prefers-color-scheme fallback if older ones matter */
    --bg: light-dark(#f6f6f4, #0d0d0d);
    --panel: light-dark(#ffffff, #161616);
    --panel-border: light-dark(#d9d9d6, #2a2a2a);
    --panel-border-active: light-dark(#3b6df0, #5b8cff);
    --text: light-dark(#1b1b1b, #e8e8e8);
    --text-dim: light-dark(#666660, #8a8a8a);
    --accent: light-dark(#3b6df0, #5b8cff);
    --accent-dim: light-dark(#dbe5ff, #2a3f6e);
    --on-accent: light-dark(#ffffff, #0a0f1c);
    --ok: light-dark(#12794c, #3ecf8e);
    --danger: light-dark(#d12f2f, #ff6b6b);
    --faint: light-dark(#b8b8b4, #444444);
    --drop-bg: light-dark(#eaf0ff, #101826);
    --chip-bg: light-dark(rgba(255,255,255,0.85), rgba(0,0,0,0.55));
    --chip-edge: light-dark(#d9d9d6, #333333);
    --swap-hover: light-dark(#e8eefc, #131b2e);
    --disabled-bg: light-dark(#e4e4e1, #2a2a2a);
    --disabled-text: light-dark(#9a9a95, #666666);
    --checker: light-dark(#e6e6e3, #1a1a1a);
    --field: light-dark(#f6f6f4, #0a0a0a);
    --btn: light-dark(#f0f0ed, #202020);
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 48px;
    gap: 24px;
  }
  .ico { width: 16px; height: 16px; flex: none; }
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px 16px;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }
  .hint {
    color: var(--text-dim);
    font-size: 11px;
  }
  header .hint { order: 3; flex-basis: 100%; }
  #pasteHint { width: 100%; max-width: 900px; margin-top: -12px; }
  .stage {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slot {
    flex: 1;
    aspect-ratio: 4/3;
    background: var(--panel);
    border: 1.5px dashed var(--panel-border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
    overflow: hidden;
  }
  .slot:hover { border-color: var(--faint); }
  .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .slot.filled {
    border-style: solid;
    border-color: var(--panel-border);
  }
  .slot.target {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }
  .slot.drag {
    border-color: var(--panel-border-active);
    background: var(--drop-bg);
  }
  .slot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .slot .placeholder {
    color: var(--text-dim);
    text-align: center;
    padding: 8px 12px;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .slot .placeholder .big { width: 24px; height: 24px; color: var(--faint); }
  .browse {
    pointer-events: auto;
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .browse:hover { border-color: var(--faint); }
  .slot .label {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: var(--chip-bg);
    padding: 2px 6px;
    border-radius: 3px;
    z-index: 2;
  }
  .slot .filename {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    font-size: 10.5px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
    padding: 14px 8px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
  }
  .slot .clear {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    padding: 0;
    background: var(--chip-bg);
    border: 1px solid var(--chip-edge);
    border-radius: 4px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
  }
  .slot .clear svg { width: 12px; height: 12px; }
  .slot .clear:hover {
    color: var(--danger);
    border-color: var(--danger);
  }
  .swap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 8px;
    border-radius: 6px;
    border: 0;
    background: none;
    font: inherit;
    user-select: none;
    transition: color 0.12s ease, background 0.12s ease;
    flex-shrink: 0;
  }
  .swap:hover {
    color: var(--accent);
    background: var(--swap-hover);
  }
  .swap .ico { width: 20px; height: 20px; }
  .swap span { font-size: 9px; letter-spacing: 0.06em; }

  input[type=file] { display: none; }

  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
  }
  .mode {
    display: flex;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    overflow: hidden;
  }
  .mode button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: none;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .mode button.active {
    background: var(--accent-dim);
    color: var(--text);
  }
  .theme button { padding: 8px 11px; }
  .spacer { flex: 1; }
  button.submit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 10px 22px;
    border-radius: 5px;
    cursor: pointer;
    transition: opacity 0.12s ease, transform 0.05s ease;
  }
  button.submit:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-text);
    cursor: not-allowed;
  }
  button.submit:not(:disabled):hover { opacity: 0.9; }
  button.submit:not(:disabled):active { transform: scale(0.98); }

  .result {
    width: 100%;
    max-width: 900px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .result.show { display: flex; }
  .result-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-wrapper {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .image-container {
    flex: 1;
  }
  .result-panel img {
    max-width: 100%;
    border-radius: 4px;
    display: block;
    background:
      linear-gradient(45deg, var(--checker) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  .result-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .filename-field {
    flex: 1 1 180px;
    min-width: 0;
    background: var(--field);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 4px;
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--btn);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:not(:disabled):hover { border-color: var(--faint); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn.copied {
    border-color: var(--ok);
    color: var(--ok);
  }
  .meta {
    color: var(--text-dim);
    font-size: 11px;
  }
  @media (max-width: 480px) {
    .slot { aspect-ratio: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>sbs</h1>
  <div class="mode theme" id="theme" role="group" aria-label="Theme">
    <button type="button" data-pick="light" title="Light" aria-label="Light"><svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg></button>
    <button type="button" data-pick="dark" title="Dark" aria-label="Dark"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg></button>
    <button type="button" data-pick="device" title="Device settings" aria-label="Device settings"><svg class="ico" aria-hidden="true"><use href="#i-computer-desktop"/></svg></button>
  </div>
  <div class="hint">drop, paste or browse two images · pick order · combine with labels</div>
</header>

<div class="stage">
  <div class="slot" id="slotA" tabindex="0"></div>

  <button type="button" class="swap" id="swapBtn" title="swap order">
    <svg class="ico" aria-hidden="true"><use href="#i-arrows-right-left"/></svg>
    <span>SWAP</span>

  <div class="slot" id="slotB" tabindex="0"></div>

<div class="controls">
  <div class="mode">

    <button type="button" id="modeV"><svg class="ico" aria-hidden="true"><use href="#i-queue-list"/></svg>vertical</button>

    </div>
  </div>
</div>

<div class="hint">runs in your browser · nothing is uploaded</div>

<script>
  const state = { A: null, B: null, mode: 'h', out: null, target: null };
  const $ = id => document.getElementById(id);
  const SIDE = { A: 'LEFT', B: 'RIGHT' };
  const icon = name => `<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  function setupSlot(key) {
    const slot = $('slot' + key);
    const select = () => { state.target = key; refresh(); };

    slot.addEventListener('click', select);
    slot.addEventListener('keydown', e => {
      if (e.target === slot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(); }
    });
    slot.addEventListener('change', e => {
      if (e.target.files[0]) loadFile(key, e.target.files[0]);
    });

    ['dragenter','dragover'].forEach(evt =>
      slot.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        slot.classList.add('drag');
      })
    );
    ['dragleave','drop'].forEach(evt =>
      slot.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        slot.classList.remove('drag');
      })
    );
    slot.addEventListener('drop', e => {
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadFile(key, f);
    });
  }

  function loadFile(key, file, name = file.name) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        state[key] = { file, img, name };
        state.target = null;
        renderSlot(key);
        $('result').classList.remove('show');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderSlot(key) {
    const slot = $('slot' + key);
    const s = state[key];
    slot.classList.toggle('filled', !!s);
    if (!s) {
      slot.innerHTML = `<span class="label">${SIDE[key]}</span>
        <div class="placeholder"><svg class="big" aria-hidden="true"><use href="#i-plus"/></svg>paste or drop<button class="browse" type="button">browse</button></div>
        <input type="file" id="input${key}" accept="image/*">`;
      slot.querySelector('.browse').addEventListener('click', () => $('input' + key).click());
    } else {
      slot.innerHTML = `<span class="label">${SIDE[key]}</span>
        <img src="${s.img.src}" alt="">
        <span class="filename"></span>
        <button class="clear" type="button" title="clear" aria-label="Clear ${SIDE[key]} image">${icon('x-mark')}</button>`;
      slot.querySelector('.filename').textContent = s.name;
      slot.querySelector('.clear').addEventListener('click', e => {
        e.stopPropagation();
        state[key] = null;
        renderSlot(key);
        $('result').classList.remove('show');
      });
    }
    refresh();
  }

  function refresh() {
    $('submitBtn').disabled = !(state.A && state.B);
    $('resetBtn').disabled = !(state.A || state.B);
    const t = state.target || (!state.A ? 'A' : !state.B ? 'B' : null);
    ['A', 'B'].forEach(k => $('slot' + k).classList.toggle('target', k === t));
    $('pasteHint').textContent = t
      ? `Paste goes to the ${SIDE[t]} panel · click a panel to pick another`
      : 'Both panels are full · click one to replace it, or paste to start a new pair';
  }

  $('swapBtn').addEventListener('click', () => {
    [state.A, state.B] = [state.B, state.A];
    renderSlot('A');
    renderSlot('B');
    $('result').classList.remove('show');
  });

  $('resetBtn').addEventListener('click', () => {
    state.A = state.B = state.out = state.target = null;
    renderSlot('A');
    renderSlot('B');
    $('result').classList.remove('show');
  });

  $('modeH').addEventListener('click', () => setMode('h'));
  $('modeV').addEventListener('click', () => setMode('v'));
  function setMode(m) {
    state.mode = m;
    [['modeH', 'h'], ['modeV', 'v']].forEach(([id, k]) => {
      $(id).classList.toggle('active', m === k);
      $(id).setAttribute('aria-pressed', m === k);
    });
  }

  function setTheme(t) {
    if (t === 'device') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.dataset.theme = t;
    document.querySelectorAll('#theme button').forEach(b => {
      const on = b.dataset.pick === t;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
    try { if (t === 'device') localStorage.removeItem('sbs-theme'); else localStorage.setItem('sbs-theme', t); } catch {}
  }
  document.querySelectorAll('#theme button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.pick)));

  function stripExt(name) {
    return name.replace(/\.[^/.]+$/, '');
  }

  $('submitBtn').addEventListener('click', () => {
    const a = state.A.img, b = state.B.img;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    if (state.mode === 'h') {
      const h = Math.max(a.height, b.height);
      const barWidth = Math.round(Math.min(Math.max(h * 0.08, 28), 220));
      const fontSize = Math.round(barWidth * 0.62);
      const aw = a.width * (h / a.height);
      const bw = b.width * (h / b.height);
      canvas.width = Math.round(aw + bw + barWidth * 2);
      canvas.height = h;

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, 0, barWidth, h);
      ctx.drawImage(a, barWidth, 0, aw, h);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(barWidth + aw, 0, barWidth, h);
      ctx.drawImage(b, barWidth * 2 + aw, 0, bw, h);

      ctx.fillStyle = 'white';
      ctx.font = `bold ${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(barWidth / 2, h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('LEFT', 0, 0);
      ctx.restore();

      ctx.save();
      ctx.translate(barWidth + aw + barWidth / 2, h / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('RIGHT', 0, 0);
      ctx.restore();
    } else {
      const w = Math.max(a.width, b.width);
      const barWidth = Math.round(Math.min(Math.max(w * 0.08, 28), 220));
      const fontSize = Math.round(barWidth * 0.62);
      const ah = a.height * (w / a.width);
      const bh = b.height * (w / b.width);
      canvas.width = w;
      canvas.height = Math.round(ah + bh + barWidth * 2);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, 0, w, barWidth);
      ctx.drawImage(a, 0, barWidth, w, ah);

      ctx.fillStyle = '#1db854';
      ctx.fillRect(0, barWidth + ah, w, barWidth);
      ctx.drawImage(b, 0, barWidth * 2 + ah, w, bh);

      ctx.fillStyle = 'white';
      ctx.font = `bold ${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(w / 2, barWidth / 2);
      ctx.fillText('LEFT', 0, 0);
      ctx.restore();

      ctx.save();
      ctx.translate(w / 2, barWidth + ah + barWidth / 2);
      ctx.fillText('RIGHT', 0, 0);
      ctx.restore();
    }

    const dataUrl = canvas.toDataURL('image/png');
    if (dataUrl === 'data:,') {
      alert('These images are too large for this browser to combine. Shrink them and try again.');
      return;
    }
    state.out = canvas;
    $('resultImg').src = dataUrl;
    $('resultMeta').textContent =
      `${canvas.width} × ${canvas.height}px · ${state.mode === 'h' ? 'horizontal' : 'vertical'} append (with labels)`;

    const suggested = `${stripExt(state.A.name)}_${stripExt(state.B.name)}.png`;
    $('filenameField').value = suggested;
    $('result').classList.add('show');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    $('downloadBtn').onclick = () => {
      const a2 = document.createElement('a');
      a2.href = dataUrl;
      a2.download = $('filenameField').value || 'appended.png';
      a2.click();
    };
  });

  function flash(btn, text, ok = true) {
    const label = btn.querySelector('span');
    label.dataset.orig ||= label.textContent;
    label.textContent = text;
    btn.classList.toggle('copied', ok);
    setTimeout(() => { label.textContent = label.dataset.orig; btn.classList.remove('copied'); }, 1200);
  }

  $('copyBtn').addEventListener('click', async () => {
    const btn = $('copyBtn');
    try {
      await navigator.clipboard.writeText($('filenameField').value);
      flash(btn, 'copied');
    } catch {
      flash(btn, 'copy blocked', false);
    }
  });

  $('copyImgBtn').addEventListener('click', async () => {
    const btn = $('copyImgBtn');
    try {
      const blob = new Promise(r => state.out.toBlob(r));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      flash(btn, 'copied');
    } catch {
      flash(btn, 'copy blocked · use download', false);
    }
  });

  document.addEventListener('paste', e => {
    const file = [...e.clipboardData.files].find(f => f.type.startsWith('image/'));
    if (!file) return;
    e.preventDefault();
    const key = state.target || (!state.A ? 'A' : !state.B ? 'B' : 'A');
    if (!state.target && state.A && state.B) { state.B = null; renderSlot('B'); }
    loadFile(key, file, key === 'A' ? 'left.png' : 'right.png');
  });

  setupSlot('A');
  setupSlot('B');
  renderSlot('A');
  renderSlot('B');
  setMode('h');
  let saved = 'device';
  try { const t = localStorage.getItem('sbs-theme'); if (t === 'light' || t === 'dark') saved = t; } catch {}
  setTheme(saved);
</script>

</body>
</html>
